[package]
name = "syntropy-xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# `cargo metadata` and `cargo build` JSON for `check-deps` (QUAL-E1-T03), and the GitHub REST
# payloads the contribution checks read (QUAL-E1-T05, RFC-0062 §12.3).
serde.workspace = true
serde_json.workspace = true
# The `determinism` step (QUAL-E3-T03): Rust tokens with their lines, to find lint attributes as
# the compiler does.
proc-macro2 = { workspace = true, features = ["span-locations"] }
# TOML: the repository's cargo config, which the `determinism` step reads, and the manifests of
# non-member path crates, which `dep-diff` reads itself (#1692).
toml.workspace = true
# BLAKE3 for the fixture store: every object is addressed and verified by it (QUAL-E7-T05,
# RFC-0060 §12.3). The workspace's version and features.
blake3.workspace = true
# YAML: the workflows and composite actions under `.github/`, which `workflows` checks against
# RFC-0062 §12.4 (QUAL-E1-T09).
yaml-rust2.workspace = true
# SHA-256 for the toolchain archives `toolchains-windows` and `toolchains-macos` fetch: the
# publishers list SHA-256 digests (QUAL-E16-T30). The workspace's version, already in the build
# through `syntropy-manifest`.
sha2.workspace = true
# The fixture store's S3 backend (QUAL-E7-T15, RFC-0060 §12.3): `reqwest`'s blocking client over
# `rustls` on `ring` with the platform's verifier. A dev-only second user of ADR-0432's HTTP stack,
# approved by the maintainers on 2026-11-07 (ADR-0432's revision note). SigV4 signing is HMAC-SHA256
# over `sha2`, so no signing crate.
reqwest.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true

[dev-dependencies]
# The cache cap property of QUAL-E7-T05 (pre-approved crate).
proptest.workspace = true
