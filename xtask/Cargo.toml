[package]
name = "syntropy-xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# `cargo metadata` and `cargo build` JSON for `check-deps` (QUAL-E1-T03), and the GitHub REST
# payloads the contribution checks read (QUAL-E1-T05, RFC-0062 §12.3).
serde.workspace = true
serde_json.workspace = true
# The manifests of non-member path crates, which `dep-diff` reads itself (#1692).
toml.workspace = true
