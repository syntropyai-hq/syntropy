[package]
name = "syntropy-xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# `cargo metadata` and `cargo build` JSON for `check-deps` (QUAL-E1-T03), and the GitHub REST
# payloads the contribution checks read (QUAL-E1-T05, RFC-0062 §12.3).
serde.workspace = true
serde_json.workspace = true
# The `determinism` step (QUAL-E3-T03): Rust tokens with their lines, to find lint attributes as
# the compiler does, and the repository's cargo config as TOML.
proc-macro2 = { workspace = true, features = ["span-locations"] }
toml.workspace = true
