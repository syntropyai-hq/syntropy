# A check-deps fixture: on macOS, the core binary links the Metal provider's system frameworks and
# nothing else, and passes rule 7.
# xtask/tests/check_deps.rs runs `cargo xtask check-deps` on it and names the findings it expects.
[workspace]
resolver = "3"
members = [
    "crates/cli",
    "crates/kernels-metal",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
