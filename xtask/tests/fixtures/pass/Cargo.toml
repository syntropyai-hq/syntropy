# A check-deps fixture: a workspace that keeps every rule, using the patterns the rules allow.
# xtask/tests/check_deps.rs runs `cargo xtask check-deps` on it and names the findings it expects.
[workspace]
resolver = "3"
members = [
    "crates/cli",
    "crates/config",
    "crates/core",
    "crates/daemon",
    "crates/exec",
    "crates/kernels",
    "crates/kernels-cpu",
    "crates/kernels-cuda",
    "crates/net",
    "crates/obs",
    "crates/solver",
    "crates/testkit",
    "crates/xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
