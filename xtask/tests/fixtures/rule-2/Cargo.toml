# A check-deps fixture: edges that do not go to a lower layer, a dev edge included, and a tool with a workspace edge (rule 2).
# xtask/tests/check_deps.rs runs `cargo xtask check-deps` on it and names the findings it expects.
[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/kernels",
    "crates/kernels-cpu",
    "crates/manifest",
    "crates/solver",
    "crates/xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
