# A check-deps fixture: crate roots that do not forbid `unsafe` outside the allow-list (rule 8).
# xtask/tests/check_deps.rs runs `cargo xtask check-deps` on it and names the findings it expects.
[workspace]
resolver = "3"
members = [
    "crates/bench",
    "crates/config",
    "crates/graph",
    "crates/io",
    "crates/kernels-metal",
    "crates/manifest",
    "crates/solver",
    "crates/testkit",
    "crates/text",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
