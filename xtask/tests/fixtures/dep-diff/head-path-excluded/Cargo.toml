# A dep-diff fixture workspace (head-path-excluded). xtask/tests/dep_diff.rs compares each head-* with base.
[workspace]
resolver = "3"
members = ["crates/a", "crates/b"]
# The vendored copy is not a member, so a path dependency on it is external code.
exclude = ["vendor"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
