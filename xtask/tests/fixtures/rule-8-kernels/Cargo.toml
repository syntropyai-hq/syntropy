# A check-deps fixture: `kernels` declares its listed `unsafe` trait methods, but also uses
# `unsafe` and allows `unsafe_code` elsewhere (rule 8).
# xtask/tests/check_deps.rs runs `cargo xtask check-deps` on it and names the findings it expects.
[workspace]
resolver = "3"
members = ["crates/kernels"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
