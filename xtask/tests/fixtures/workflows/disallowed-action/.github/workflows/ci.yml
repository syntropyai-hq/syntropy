# SPDX-License-Identifier: MIT OR Apache-2.0

# A workflow-lint fixture: a pinned action the repository's actions policy does not allow, which
# GitHub refuses at startup, so the whole workflow runs no job (#1984).
name: ci
on: [pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - run: cargo xtask ci toolchains-linux
