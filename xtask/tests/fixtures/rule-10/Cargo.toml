# A check-deps fixture: release crates built with test-only features of `obs` (rule 10).
# xtask/tests/check_deps.rs runs `cargo xtask check-deps` on it and names the findings it expects.
[workspace]
resolver = "3"
members = [
    "crates/cli",
    "crates/kernels-vulkan",
    "crates/obs",
    "crates/testkit",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
