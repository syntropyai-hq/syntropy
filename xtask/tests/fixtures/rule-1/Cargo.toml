# A check-deps fixture: `core` depends on a workspace crate and on an external crate outside its allow-list (RFC-0001 §4.2 rule 1).
# xtask/tests/check_deps.rs runs `cargo xtask check-deps` on it and names the findings it expects.
[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/obs",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
