# A check-deps fixture: the daemon links provider crates, directly and through `exec` (rule 4).
# xtask/tests/check_deps.rs runs `cargo xtask check-deps` on it and names the findings it expects.
[workspace]
resolver = "3"
members = [
    "crates/daemon",
    "crates/exec",
    "crates/kernels",
    "crates/kernels-cpu",
    "crates/kernels-loader",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
