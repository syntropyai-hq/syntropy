# A check-deps fixture: compute crates that reach `net` or `tokio` (rule 3 and ADR-0012 §6).
# xtask/tests/check_deps.rs runs `cargo xtask check-deps` on it and names the findings it expects.
[workspace]
resolver = "3"
members = [
    "crates/exec",
    "crates/io",
    "crates/kernels-cpu",
    "crates/net",
    "crates/sched",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
