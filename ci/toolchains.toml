sha256 = "17d0ca1592c0dfc974a5fc39f470a6b7bae40da239e3e19bd0752017735acbca"

[windows.msvc]
# Visual Studio's servicing line: "Visual Studio Enterprise 2026 | 18.11.12328.437" in the report
# of image 20261030.294.1, and 18.11.12315.225 in that of 20261021.278.1 (tag
# win25-vs2026/20261021.278, commit ca1c9228ba0c). The label served both on 2026-10-30, so the pin
# is the line both share; the toolset and `cl` below stay exact (RFC-0062 §4.2, note 2026-10-31).
visual_studio = "18.11"
# The report lists neither the default toolset nor `cl`'s version; job 124315799952 printed both.
toolset = "14.51.36231"
cl = "19.51.36260"

[macos.cmake]
version = "4.4.4"
sha256 = "4b7b73704b1db9b374e5c9ab8e17ac6148b817b6396ee75cd94a852cbac9d305"

[macos.xcode]
# "26.6 (default) | 17F113" in the image report.
version = "26.6"
build = "17F113"
# The report lists "Clang/LLVM 21.0.0"; job 124315799909 printed the full version.
clang = "21.0.0 (clang-2100.1.1.101)"

# From Xcode 26 the Metal toolchain is a component of its own, and the report does not list it.
# When the image lacks it, `toolchains-macos` fetches it with `xcodebuild -downloadComponent
# MetalToolchain`, and says so in its log. That download has no checksum pin of ours: Apple serves
# it as a signed Xcode component, under the same trust root as Xcode itself, and publishes no
# digest to pin. The job checks the compiler's printed version against this pin instead. Job
# 124315799909 printed it, with the toolchain already on the image.
[macos.metal]
version = "32023.883 (metalfe-32023.883)"
