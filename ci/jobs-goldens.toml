# SPDX-License-Identifier: MIT OR Apache-2.0
#
# The golden suite of the affected-job rules in `ci/jobs.toml` (RFC-0062 §2.2; QUAL-E1-T07).
# `lint`'s `jobs` step applies the rules to each golden's paths and fails unless they give exactly
# its `jobs` (the hosted jobs listed), `hw_required` (the hardware jobs required) and `planned`
# (the planned jobs whose rule matched). It also fails unless every job, pattern and lock
# dependency in the rules is met by some golden, some golden has a path no rule knows, and
# `jobs_toml` is the digest of the `ci/jobs.toml` the goldens were last checked against.
#
# Most goldens are commits on `main`, with the paths `git show --no-renames --name-only` lists
# and, where `Cargo.lock` changed, the packages whose entries changed. The rest are constructed,
# for paths that no commit has touched yet, and say so. The expected sets were worked out from
# `cargo metadata`'s graph and the rules, not from `changes` itself.
#
# After a change to `ci/jobs.toml`: re-check each golden, add one for each new rule or pattern,
# and set `jobs_toml` to the digest `lint` prints.

jobs_toml = "fnv1a:fb6411af5533ff8e"

