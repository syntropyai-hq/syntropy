# The fixture manifest (RFC-0060 §12.3, QUAL-E7-T05): every object in the fixture store that a
# test reads, by its BLAKE3. `cargo xtask fixtures import` fills `blake3` and `bytes`; `fetch`
# and `verify` refuse any object whose bytes differ. The first real checkpoints came with QUAL-E7-T06
# (RFC-0060 §12.2's licence rule; `lint`'s `fixtures` step checks it). Each Hub file records the
# repository, the commit, the file and the Hub's own hash of it: `sha256` for an LFS file, the
# git `blob` id otherwise.
#
# [[fixture]]
# name    = "..."
# blake3  = ""              # content address; also the cache key
# bytes   = 0               # filled by the import tool
# source  = { hub = "...", revision = "...", file = "..." }
# licence = "apache-2.0"
# gated   = false
# tier    = "nightly"       # or "lab": gated, lab-only or too large for nightly runs
# quant   = "q4_k"          # a fixture quantised with RFC-0042's quantizers only
# quantised_from = "<hub repo>@<40-hex revision>"
# used_by = ["..."]

