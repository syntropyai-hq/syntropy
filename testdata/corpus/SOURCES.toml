select = "annotation_type = original-annotations only. One item per pair, as one user and assistant exchange. Languages: arb (Arabic script), hin (Devanagari), zho, jpn and kor (CJK), rus and ukr (Cyrillic), tha, ell, heb, ben, and Latin-script languages to fill. At least 8 languages, each script group present."
notes = "Re-annotations are excluded because they edit automatically generated text whose origin and licence the card does not state. As with oasst2, a contributor could still have pasted a hosted-service reply; MASSIVE, released in April 2022, covers the same scripts."

