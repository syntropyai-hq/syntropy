hosted_service_output = false
provenance = "Prompt and completion pairs written by fluent speakers on the Aya annotation platform in 2023, in 65 languages. The card separates original annotations (written from scratch) from re-annotations (human edits of automatically generated text). The annotation guidelines say: \"For original annotations, the prompts and completions should not be generated from other language models\" (Aya Dataset paper, arXiv:2402.06619v1, Appendix B.3, item 4), with no exception for edited text."
