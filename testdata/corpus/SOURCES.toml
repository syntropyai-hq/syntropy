# ---------------------------------------------------------------- code
# Ten languages: Rust, C, Go, Python, Java, C++, TypeScript, JavaScript,
# Ruby, C#. Shared rule for every repository source:
#   - files under `include`, minus `exclude`, by the language's extensions;
#   - generated files are skipped: a header line matching, without regard
#     to case, "code generated", "@generated", "do not edit" or "machine
#     generated". So is any file whose header names a licence other than
#     the source's. Unicode-derived tables are also listed in `exclude`,
#     because the Unicode licence is not on the list;
#   - diffs are the unified diffs of non-merge commits on the first-parent
#     history at or before the pin, restricted to the same paths.

