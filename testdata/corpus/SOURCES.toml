[[source]]
id = "syntropy-stress"
categories = { stress = "primary" }
kind = "generated"
name = "Syntropy tokenizer stress items"
url = "testdata/corpus/"
revision = "frozen with each corpus version (QUAL-E5-T02 freeze rule)"
licence = "MIT OR Apache-2.0"
licence_url = "https://github.com/syntropyai-hq/syntropy/blob/main/LICENSE-MIT"
licence_evidence = "Syntropy-authored generator output, MIT OR Apache-2.0 (ADR-0018 decision 1)"
hosted_service_output = false
provenance = "Generated per tokenizer by the project. The only input is the tokenizer itself, which comes with a fixture whose source and licence testdata/fixtures.toml records."
select = """
Recipe, implemented by QUAL-E5-T22, per tokenizer:
1. Repeated tokens: runs of one frequent token, one rare token and one single-byte token, at 64, 512 and 4,096 repeats.
2. Whitespace: runs of spaces, tabs, newlines and CRLF pairs up to 8,192 characters, and the same with U+00A0, U+3000 and U+2028.
3. The maximal-length token: the vocabulary entry with the most bytes, alone, repeated, and inside ordinary text.
4. Every special token: once by token ID, where a template span would emit it, and once as its literal string in a content span, where it must tokenize as plain text (RFC-0043 §8.7).
5. Each item records the tokenizer's content hash, so its token stream is fixed per tokenizer.
"""
notes = "Items reproduce vocabulary strings from the tokenizer under test. An item built from a gated or lab-only tokenizer takes that fixture's access rule in the fixture store and is not made public by default (ADR-0603 decision 8)."

