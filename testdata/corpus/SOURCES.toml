[[source]]
id = "pg19"
categories = { long = "primary" }
kind = "snapshot"
name = "PG-19 language-modelling benchmark"
url = "https://storage.googleapis.com/deepmind-gutenberg/"
revision = "GCS object generations of 2019-09-16 under test/, validation/ and train/"
revision_date = "2019-09-16"
files = [
  # SHA-256 of the sorted lines "<name> <size> <md5Hash> <generation>\n" from
  # the GCS JSON API object listing of each prefix, where <name> is the full
  # object name with its prefix (for example "test/10146.txt"); bare file
  # names give a different hash. QUAL-E5-T22 recomputes it before import and
  # fails on a mismatch, then checks each object's MD5 and records a SHA-256
  # over its bytes.
  { path = "test/", objects = 100, bytes = 41289101, listing_sha256 = "ee09996fb15f9071f2c1059c84ba79c45992beeaa4e86b6598f251be3434ab3c" },
  { path = "validation/", objects = 50, bytes = 17733002, listing_sha256 = "ed401ac77a3be3014e2a7ec43d19df726049937b5a36071780b24e0cfb8bf9d1" },
  # Reserve pool, used only if the death-year rule leaves test/ and
  # validation/ short of the `calibration` tier's 64 books.
  { path = "train/", objects = 28602, bytes = 11678184667, listing_sha256 = "3f58ae70b55cd39d5e301e3742ffb2a9613e82abcd85d5320af055e27fee9ef7" },
]
licence = "Apache-2.0"
licence_url = "https://github.com/google-deepmind/pg19/blob/b0e1f2925359688af19f8784c23c3deeda52d3ea/LICENSE"
licence_evidence = "LICENSE in the dataset's repository is the Apache License 2.0 text (commit b0e1f29, 2020-02-25); the Hub card at revision 4d28bd77e66947ad3835cf78ed7aaeb4dd87ad8b also states Apache 2.0"
licence_files = [
  { path = "LICENSE", sha256 = "cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30" },
]
underlying_licence = "LicenseRef-public-domain"
hosted_service_output = false
provenance = "Books from Project Gutenberg published before 1919, with the Project Gutenberg licence boilerplate removed by the dataset's authors."
select = """
Whole books. Per tokenizer, books of at least 32K tokens fill the 32K slots and books of at least 128K tokens the 128K slots, each cut to the slot length at a token boundary from the start. Books come from test/ and validation/; train/ is drawn from, in object-name order, only if those two leave a tier short.
Death-year rule: a book is kept only if every creator its catalogue record names (author, and any translator, editor or other contributor) died before 1956, so the text is out of copyright under life-plus-70 terms as well as in the US. The death year comes from the book's record in gutenberg-catalogue-rdf (the object name's number is the ebook number); where that record has no death date, from wikidata via the creator's Project Gutenberg author ID. A book with any creator undated in both, or dated 1956 or later, is not imported. Each kept item records every creator's death year and the record it came from.
"""
notes = "By size, 79 test books exceed about 32K tokens and 18 exceed about 128K [estimate: object bytes at about 4 characters per token]; the `calibration` tier needs 62 and 2. The validation split adds 41 and 8, and train/ 22,167 and 6,475. How many books the death-year rule keeps is not measured: QUAL-E5-T22 reports it."

