# Parity corpus sources (RFC-0060 §5.2; ADR-0603 decision 8).
#
# QUAL-E5-T01 picked these sources and read each licence at the pinned
# revision on the `verified` date. This file lists sources only. Corpus items,
# their per-item licence records and the `smoke` tier's token streams come
# from QUAL-E5-T22, the other tiers' token streams from QUAL-E5-T02, and the
# item text lives in the fixture store, not in git (RFC-0060 §1.2).
#
# Fields of a [[source]] table:
#   id                 stable key that item manifests cite
#   categories         RFC-0060 §5.2 categories this source feeds, each with
#                      its role there: "primary" is the main supply;
#                      "secondary" broadens it and keeps the category covered
#                      if a primary is dropped
#   kind               dataset (a published dataset, on the Hub or in a git
#                      repository) | snapshot (fixed objects with checksums) |
#                      repository (code or templates) | generated (by Syntropy)
#   url                where the source is fetched from
#   revision           commit SHA, dataset revision, or snapshot name
#   revision_date      date of that revision (UTC)
#   files              fetched files with their content hashes, where fixed
#   include / exclude  paths taken from a repository, and paths left out
#   licence            SPDX expression; LicenseRef-public-domain for public domain
#   licence_url        the licence file or dataset card at the pinned revision
#   licence_evidence   what that file says
#   licence_files      licence and notice files, with the SHA-256 of the copy
#                      read on the verified date; kept beside published items
#   attribution_file   committed attribution, required for CC-BY sources
#   hosted_service_output
#                      false: no item may be text produced by a hosted
#                      commercial model service (OQ-FID-17)
#   provenance         who wrote the text, and when
#   access             how the source may be fetched, where its terms restrict it
#   user_agent         the User-Agent QUAL-E5-T22 sends, where the source asks for one
#   select             the selection rule QUAL-E5-T22 implements
#   notes              anything else a reviewer needs
#
# A [[metadata]] table is a source of facts about items, not of item text.
# It has the same fields, with `used_by` (the source ids it serves) in place
# of `categories`. Its licence is checked against the same list.

schema = 1
corpus = "parity-corpus-v1"
task = "QUAL-E5-T01"
verified = "2026-10-21"

[policy]
# OQ-FID-17, ADR-0603 decision 8.
allowed = [
  "LicenseRef-public-domain",
  "CC0-1.0",
  "CC-BY-4.0",
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
]
excluded = ["CC-BY-SA-*", "CC-BY-NC-*", "outputs of hosted commercial model services"]
# The `tool` category is generated from templates under one of these.
template_licences = ["CC0-1.0", "MIT"]
# Code and template repositories are pinned to their last commit before this
# date, so the pinned text predates public large-model code-generation
# services (the first public preview was in June 2021) and the hosted-output
# exclusion holds by date rather than by trust.
repository_cutoff = "2021-06-01"

