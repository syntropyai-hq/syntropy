notes = "Re-annotations are excluded because they edit automatically generated text whose origin and licence the card does not state. The guideline excludes model-written text, but compliance by every contributor cannot be checked from the data; MASSIVE, released in April 2022, covers the same scripts. Original-annotation rows per language at the pin, from the Hub's dataset query API on 2026-10-21: arb 2,756; hin 773; zho 4,028; jpn 6,149; kor 180; rus 116; ukr 221; tha 266; ben 750."

