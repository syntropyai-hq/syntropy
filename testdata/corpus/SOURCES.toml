[[source]]
id = "syntropy-tool-frames"
categories = { tool = "primary" }
kind = "generated"
name = "Syntropy tool-call conversation templates"
url = "testdata/corpus/"
revision = "frozen with each corpus version (QUAL-E5-T02 freeze rule)"
licence = "MIT OR Apache-2.0"
licence_url = "https://github.com/syntropyai-hq/syntropy/blob/main/LICENSE-MIT"
licence_evidence = "Syntropy-authored files are MIT OR Apache-2.0 (ADR-0018 decision 1); the MIT option meets the `tool` template rule"
hosted_service_output = false
provenance = "Written for this corpus by the project. Every item made from them is marked template-generated (RFC-0060 §5.2)."
select = """
Recipe, implemented by QUAL-E5-T22:
1. A frame is a fixed conversation shape: system turn with a tool list; user request; assistant tool call; tool result; assistant answer. Shapes cover one call, parallel calls, a call with nested object and array arguments, a rejected call followed by a corrected one, and a structured-output turn where the assistant answers with one JSON object that must match a given schema.
2. Tool definitions: `name` and `description` from tool-public-apis, `parameters` from tool-json-schema-test-suite.
3. Call arguments and tool results are instances from the same test group; natural-language user turns are filled from frame text with slot values drawn from those instances.
4. A seeded generator picks frames and inputs. Each item records the generator version, the seed, the frame id and the source items it used.
5. Items are rendered with each family's chat template and its tool-call syntax at token-stream time, the same way `chat` is.
"""
item_licence = "MIT"
item_notices = ["tool-json-schema-test-suite: LICENSE", "tool-public-apis: LICENSE"]
notes = "Items embed MIT material from both template inputs, so each item's licence record is MIT, carrying both upstream copyright and permission notices, rather than the project expression alone."

