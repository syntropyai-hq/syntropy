#
# Tolerance table v1: the thresholds of the exactness contract (RFC-0042 §5.2, §6, §7.1;
# ADR-0019 decision 3; ADR-0422 decisions 4-7). `syntropy-kernels` embeds the newest
# `tolerances-v<N>.toml` in every build and stamps its version into results and responses.
# `numerics.tolerances` points a build at another file, which marks it unofficial (RFC-0042 §11).
#
# Every entry has a `status`:
#   "pending"      no value yet. Calibration has not run, so the entry carries no numbers.
#   "provisional"  a published ceiling that rests on dense calibration models only, or, for a
#                  layer-local ceiling, on fewer than three families with that layer kind
#                  (RFC-0042 §5.2, §6.2). It still gates.
#   "final"        a published value.
# Values come only from calibration (COMP-E14-T03 at M0b, COMP-E14-T04 at M1a) and from op
# conformance on ggml pin bumps (RFC-0042 §6.4). None has been measured yet, so this version
# holds no numbers. A release build refuses to start a model whose dtype class has a pending
# end-to-end ceiling (`ToleranceMissing`, numerics code 1).
#
# Dtype classes (RFC-0042 §1.2): float16, fp8, int8, bits4, sub4.
# Corpus categories (RFC-0060 §5.2): chat, code, long, tool, multi, stress.

schema = 1
version = 1

# End-to-end ceilings C(d), pooled and per category (RFC-0042 §6.1, §6.2): kl_mean and kl_p99
# in nats, top1 as the top-1 disagreement rate. Each is the maximum over the class's
# calibration models of max(2 S, phi) pooled or max(3 S_c, phi) per category, rounded up to
# two significant digits. A class's scopes are all pending or all published.

[end_to_end.float16]
pooled = { status = "pending" }
chat = { status = "pending" }
code = { status = "pending" }
long = { status = "pending" }
tool = { status = "pending" }
multi = { status = "pending" }
stress = { status = "pending" }

