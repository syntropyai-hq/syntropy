# Op-level tolerances per op class and dtype class (RFC-0042 §6.4), one `[[op]]` entry each:
#   [[op]]
#   op = "<op class>"   class = "<dtype class>"   status = "final"
#   eps_op, ceiling_op, ceiling_op_max, tol_op, tol_ref   (rel_l2, or max_abs_scaled for
#                                                         ceiling_op_max; tol_ref = tol_op)
# None yet: op conformance (QUAL-E4-T04) computes them over the op registry (COMP-E1-T02).

# The model-definition oracle's tolerance per family (RFC-0042 §7.1; ADR-0422 decision 7).
# A published entry has `s_pub_source` ("publisher", or "ref" when the publisher's code cannot
# run in F64 and S_ref stands in for S_pub) and, for each of kl_mean, kl_p99, top1 and
# norm_rel, `{ s_pub, s_ref, tau_def }` with tau_def = 2 max(s_pub, s_ref). `llama` and
# `qwen_moe` are certified from M0 (RFC-0043 §9.2).
[definitional.llama]
status = "pending"

[definitional.qwen_moe]
status = "pending"
