# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Every success criterion of plan/00-vision-and-scope.md §7, mapped to the scenarios, rigs, metric
# and pass rule that measure it (RFC-0061 §4.2). RFC-0061 §4.2's table is rendered from this file:
# after editing it, run `syntropy-bench scenarios render --write`. The `lint` job's
# `syntropy-bench scenarios check` fails if a criterion has no row or the table is stale.
#
# - `scenarios`, `rigs`, `measured`, `pass`: the table's cells, as Markdown on one line each.
# - `patterns`: the scenario IDs the cell names, with `*` for one segment, or one or more as the
#   last segment. Empty when no scenario file measures the criterion (an RFC-0060 property,
#   chaos or parity result, or the release gate).
# - `added_owners`: owners the acceptance criteria don't show. A row's owners are derived from
#   plan/implementation/epics/: every task whose acceptance criteria name the criterion (ranges
#   such as SC-1–SC-4 included), in milestone order, plus these. List here only a scenario task
#   whose row names the criterion in its task or Implements cell but not in its acceptance
#   criteria. `syntropy-bench scenarios check` fails when an added owner's criteria name the
#   criterion already, or its row doesn't name it at all.
# - `[[not_owner]]`, at the end: a task whose acceptance criteria name criteria it does not own,
#   with the reason. The check fails when the task's criteria stop naming one of them.
#
# When an epic edit starts or stops citing a criterion, RFC-0061 §4.2's table goes stale and the
# check names the row and the task: render the table again, or add a `[[not_owner]]` entry.

[[sc]]
id = "SC-1"
scenarios = "`kern.gemv.dense.*`, `kern.moe.grouped.*`, `kern.cpu.eip.*` (§9)"
patterns = ["kern.gemv.dense.*", "kern.moe.grouped.*", "kern.cpu.eip.*"]
rigs = "R-ADA (AVX2 host), R-BW (AVX-512 host), R-WIN, R-MACF, R-ULTRA-A, R-HALO"
measured = "η = W_ach / W_peak per kernel class; CPU: W_ach / probe all-core read"
pass = "≥ 0.80 dense on `Vram`/`Unified`; ≥ 0.63 grouped MoE; ≥ 0.75 CPU in place"

[[sc]]
id = "SC-2"
scenarios = "`decode.single.llama1b`, `.llama8b`, `.llama70b` at Q4 on each rig; intercept of `t_tok` against bytes"
patterns = ["decode.single.llama1b.*", "decode.single.llama8b.*", "decode.single.llama70b.*"]
rigs = "every Tier 1 GPU rig"
measured = "fitted `t_fixed`; telemetry `t_fixed_ach`"
pass = "`t_fixed ≤ 0.2 · 3.79 GB / W_probe`"

[[sc]]
id = "SC-3"
scenarios = "every `decode.single.*` scenario"
patterns = ["decode.single.*"]
rigs = "all"
measured = "`t_tok` against `t_model` (§5.1)"
pass = "`t_tok ≤ 1.05 · t_model`"
added_owners = ["QUAL-E13-T02"]

[[sc]]
id = "SC-4"
scenarios = "`decode.single.llama70b.q4km.cap64g` (scenario a); `.llama70b.q4km` and `tiered.single.dsv3.4bit` on R-ULTRA-A"
patterns = ["decode.single.llama70b.q4km.cap64g", "decode.single.llama70b.q4km", "tiered.single.dsv3.4bit"]
rigs = "R-ADA, R-ULTRA-A"
measured = "decode rate against `t_peak` (§5.1)"
pass = "≥ 0.67 (split across `Vram` and DRAM); ≥ 0.76 (one tier); ≥ 0.60 (MoE in `Vram`/`Unified`)"

[[sc]]
id = "SC-5"
scenarios = "`tiered.single.dsv3.q4km.sustained` (scenario b2)"
patterns = ["tiered.single.dsv3.q4km.sustained"]
rigs = "R-ADA (128 GB)"
measured = "`t_tok`, measured h"
pass = "`t_tok ≤ 1.10 · t_overlap(h)`"

[[sc]]
