pass = "`t_tok ≤ 1.05 · t_model`"
owners = ["QUAL-E12-T09", "QUAL-E12-T10", "QUAL-E13-T02", "PROD-E8-T08", "QUAL-E13-T03", "QUAL-E13-T20"]

