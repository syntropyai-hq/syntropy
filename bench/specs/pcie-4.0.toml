#
# A spec record (RFC-0061 §5.3): `crates/bench/src/specs.rs` documents the format. A link's
# rate per direction is GT/s × the encoding's payload fraction ÷ 8 bits × lanes: 31.5 GB/s for
# x16, 7.88 GB/s for x4.

kind = "pcie"
models = ["PCIe 4.0"]
generation = 4

[transfer_gt_per_s]
value = 16.0
source = "https://pcisig.com/faq?field_category_value%5B%5D=pci_express_4.0"
where = "PCI Express 4.0 FAQ: \"At 16.0 GT/s bit rate, the interconnect performance bandwidth will be doubled over the PCIe 3.0 specification\""
checked = "2026-10-22"

[encoding]
value = "128b/130b"
source = "https://pcisig.com/faq?field_category_value%5B%5D=pci_express_3.0"
where = "PCI Express 3.0 FAQ: PCIe 3.0 \"uses a more efficient 128b/130b encoding scheme\" at 8.0 GT/s. PCIe 4.0 keeps PCIe 3.0's 128b/130b encoding: the 4.0 FAQ says its 16.0 GT/s doubles the bandwidth of PCIe 3.0, which only the same encoding at twice the bit rate gives. The 4.0 FAQ does not name the encoding itself."
checked = "2026-10-22"
