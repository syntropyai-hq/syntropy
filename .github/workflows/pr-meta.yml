# SPDX-License-Identifier: MIT OR Apache-2.0

# The contribution checks `dco` and `pr-title` (RFC-0062 §12.3), `dep-diff` for new direct
# dependencies (§12.3, §11.4), and `properties-removal` for properties removed from
# `ci/properties.toml` (RFC-0060 §3.2), all required checks (§2.5). They judge a PR's commits,
# title, body, labels, comments, manifests and property registry, so the PR must not be able to
# change
# how it is judged. Each job checks out the base branch, never the PR, and runs the base branch's
# `cargo xtask` with the base branch's `governance/maintainers.toml` and `version.txt`. It restores
# no cache, so nothing the PR ran elsewhere reaches the build. A job that compares the PR's files
# with the base's, such as `dep-diff`, takes the base as the first parent of the merge commit it
# reads the PR from, so both sides share one main commit (issue #1702).
#
# They are a workflow of their own because they run again when a label is added or removed and
# when the title or body is edited. Run in `pr.yml`, such an event would also post a `ci-gate` with
# its hosted jobs skipped, and a skipped job passes. For the same reason both jobs check in full
# on every PR event: a job skipped on a label event would post a passing check over a failing one.
#
# The same rules as `pr.yml` hold: read-only permissions, actions pinned by SHA, hosted runners
# or the build host behind its gate (ADR-0625) only.

name: pr-meta

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: pr-meta-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

defaults:
  run:
    shell: bash

jobs:
  dco:
    runs-on: ${{ (vars.SYNTROPY_BUILD_HOST == 'on' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository)) && 'syntropy-build' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      # A merge group has no PR payload, and `dco` already passed on each member PR's head.
      - name: Pass on a merge group
        if: github.event_name == 'merge_group'
        run: echo "dco is required on each member PR's head (RFC-0062 §12.3)"
      - name: Check out the base branch, not the PR
        if: github.event_name != 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      # No cache: code the PR runs in any other job can write a cache entry under this PR's ref,
      # and a restored `target/` could hold an `xtask` built from the PR. Built from scratch, the
      # check is the base branch's.
      - if: github.event_name != 'merge_group'
        uses: ./.github/actions/setup-rust
        with:
          cache-key: pr-meta
          cache: "off"
      - name: Fetch every commit of the PR
        if: github.event_name != 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: gh api --paginate "repos/$REPO/pulls/$NUMBER/commits" > "$RUNNER_TEMP/commits.json"
      - name: cargo xtask ci dco
        if: github.event_name != 'merge_group'
        run: >-
          cargo xtask ci dco
          --event "$GITHUB_EVENT_PATH"
          --commits "$RUNNER_TEMP/commits.json"

  pr-title:
    runs-on: ${{ (vars.SYNTROPY_BUILD_HOST == 'on' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository)) && 'syntropy-build' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Pass on a merge group
        if: github.event_name == 'merge_group'
        run: echo "pr-title is required on each member PR's head (RFC-0062 §12.3)"
      # A changed base does not re-run `pr.yml`, so its `ci-gate` would still stand for the old
      # base. Fail until a push re-runs it (RFC-0062 §2.5, note 2026-10-22).
      - name: Fail when the base branch changed
        if: >-
          github.event_name == 'pull_request' && github.event.action == 'edited' &&
          github.event.changes.base
        run: |
          echo "::error::the base branch changed; push to the PR so pr.yml runs ci-gate against the new base"
          exit 1
      - name: Check out the base branch, not the PR
        if: github.event_name != 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      # No cache, as in `dco`.
      - if: github.event_name != 'merge_group'
        uses: ./.github/actions/setup-rust
        with:
          cache-key: pr-meta
          cache: "off"
      # The label history is fetched with its headers, which show that the last page was read.
      - name: Fetch every commit and the label history of the PR
        if: github.event_name != 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$REPO/pulls/$NUMBER/commits" > "$RUNNER_TEMP/commits.json"
          gh api --include --paginate "repos/$REPO/issues/$NUMBER/events" \
            > "$RUNNER_TEMP/label-events.http"
      - name: cargo xtask ci pr-title
        if: github.event_name != 'merge_group'
        run: >-
          cargo xtask ci pr-title
          --event "$GITHUB_EVENT_PATH"
          --commits "$RUNNER_TEMP/commits.json"
          --label-events "$RUNNER_TEMP/label-events.http"
          --roster "$GITHUB_WORKSPACE/governance/maintainers.toml"
          --version-file "$GITHUB_WORKSPACE/version.txt"

  dep-diff:
    runs-on: ${{ (vars.SYNTROPY_BUILD_HOST == 'on' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository)) && 'syntropy-build' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Pass on a merge group
        if: github.event_name == 'merge_group'
        run: echo "dep-diff is required on each member PR's head (RFC-0062 §12.3)"
      # The base and the head must share one main commit (issue #1702). The head is the PR merged
      # into main, `github.sha`, and the base is that merge commit's first parent: the main commit
      # it was built on. `pull_request.base.sha` can be older, and then whatever main gained since
      # would be charged to the PR. The root holds the base, so check out the merge commit two
      # commits deep and move to its first parent before anything runs. None of the PR's code runs.
      - name: Check out the merge commit, two commits deep
        if: github.event_name != 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Move to the base, the merge commit's first parent
        if: github.event_name != 'merge_group'
        run: git checkout --detach --quiet HEAD^1
      # The PR merged into main, read as data: `cargo metadata --no-deps` on its manifests, and its
      # licence manifest. None of its code runs.
      - name: Check out the PR's manifests, as data
        if: github.event_name != 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          path: pr
          persist-credentials: false
      - name: Check that the base is the head's first parent
        if: github.event_name != 'merge_group'
        run: test "$(git -C pr rev-parse HEAD^1)" = "$(git rev-parse HEAD)"
      # And that the head is this PR's merge: its second parent is the PR's head commit. A merge
      # commit without a second parent fails here too.
      - name: Check that the head's second parent is the PR's head commit
        if: github.event_name != 'merge_group'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git -C pr rev-parse HEAD^2)" = "$HEAD_SHA"
      # No cache, as in `dco`.
      - if: github.event_name != 'merge_group'
        uses: ./.github/actions/setup-rust
        with:
          cache-key: pr-meta
          cache: "off"
      # A maintainer approves a new dependency with a PR comment naming the head commit;
      # `dep-approval.yml` re-runs this job when such a comment is posted, edited or deleted.
      # The roster comes from the base branch's current tip, not from the checkout: a re-run
      # replays the original event, and its base commit could predate a maintainer's removal.
      - name: Fetch the PR's comments and the base branch's current roster
        if: github.event_name != 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          gh api --paginate "repos/$REPO/issues/$NUMBER/comments" > "$RUNNER_TEMP/comments.json"
          gh api --method GET -H "Accept: application/vnd.github.raw" \
            "repos/$REPO/contents/governance/maintainers.toml" -f ref="$BASE_REF" \
            > "$RUNNER_TEMP/maintainers.toml"
      # The base branch's `dep-diff` decides. `cargo xtask` exits 2 on a usage error, which an
      # unknown job is: that exit code says the base has no `dep-diff` job. Bootstrap: only #1590,
      # the PR that adds the job, may then be judged by its own; every other such base fails.
      - name: cargo xtask ci dep-diff, from the base branch
        id: gate
        if: github.event_name != 'merge_group'
        env:
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          status=0
          cargo xtask ci dep-diff \
            --base "$GITHUB_WORKSPACE" \
            --head "$GITHUB_WORKSPACE/pr" \
            --event "$GITHUB_EVENT_PATH" \
            --comments "$RUNNER_TEMP/comments.json" \
            --roster "$RUNNER_TEMP/maintainers.toml" || status=$?
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "$status" -eq 2 ] && [ "$NUMBER" = 1590 ]; then
            echo "::warning::the base branch has no dep-diff job yet; #1590, which adds it, is judged by its own"
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -eq 2 ]; then
            echo "::error::the base branch has no dep-diff job, or rejected its options; rebase onto main"
          fi
          exit 1
      - name: cargo xtask ci dep-diff, from #1590 (bootstrap only)
        if: steps.gate.outputs.bootstrap == 'true'
        working-directory: pr
        run: |
          rustup toolchain install --no-self-update
          cargo xtask ci dep-diff \
            --base "$GITHUB_WORKSPACE" \
            --head "$GITHUB_WORKSPACE/pr" \
            --event "$GITHUB_EVENT_PATH" \
            --comments "$RUNNER_TEMP/comments.json" \
            --roster "$RUNNER_TEMP/maintainers.toml"

  # A property removed from `ci/properties.toml` needs a reason in the PR description (RFC-0060
  # §3.2; QUAL-E3-T05). It judges the description, so it is here and re-runs on every edit.
  properties-removal:
    runs-on: ${{ (vars.SYNTROPY_BUILD_HOST == 'on' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository)) && 'syntropy-build' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Pass on a merge group
        if: github.event_name == 'merge_group'
        run: echo "properties-removal is required on each member PR's head (RFC-0060 §3.2)"
      # The base and the head share one main commit, as in `dep-diff` (issue #1702): the head is
      # the PR merged into main, `github.sha`, and the base is that merge commit's first parent.
      # The root holds the base, so check out the merge commit two commits deep and move to its
      # first parent before anything runs. None of the PR's code runs.
      - name: Check out the merge commit, two commits deep
        if: github.event_name != 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Move to the base, the merge commit's first parent
        if: github.event_name != 'merge_group'
        run: git checkout --detach --quiet HEAD^1
      # The PR merged into main, read as data: only its `ci/properties.toml`. None of its code
      # runs.
      - name: Check out the PR's registry, as data
        if: github.event_name != 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          path: pr
          persist-credentials: false
      - name: Check that the base is the head's first parent
        if: github.event_name != 'merge_group'
        run: test "$(git -C pr rev-parse HEAD^1)" = "$(git rev-parse HEAD)"
      # And that the head is this PR's merge: its second parent is the PR's head commit. A merge
      # commit without a second parent fails here too.
      - name: Check that the head's second parent is the PR's head commit
        if: github.event_name != 'merge_group'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git -C pr rev-parse HEAD^2)" = "$HEAD_SHA"
      # No cache, as in `dco`.
      - if: github.event_name != 'merge_group'
        uses: ./.github/actions/setup-rust
        with:
          cache-key: pr-meta
          cache: "off"
      # The base branch's `properties-removal` decides. `cargo xtask` exits 2 on a usage error,
      # which an unknown job is: that exit code says the base has no such job. Bootstrap: only
      # #1667, the PR that adds the job, may then be judged by its own;
      # every other such base fails.
      - name: cargo xtask ci properties-removal, from the base branch
        id: gate
        if: github.event_name != 'merge_group'
        env:
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          status=0
          cargo xtask ci properties-removal \
            --base "$GITHUB_WORKSPACE" \
            --head "$GITHUB_WORKSPACE/pr" \
            --event "$GITHUB_EVENT_PATH" || status=$?
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "$status" -eq 2 ] && [ "$NUMBER" = 1667 ]; then
            echo "::warning::the base branch has no properties-removal job yet; #$NUMBER, which adds it, is judged by its own"
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -eq 2 ]; then
            echo "::error::the base branch has no properties-removal job, or rejected its options; rebase onto main"
          fi
          exit 1
      - name: cargo xtask ci properties-removal, from the PR that adds it (bootstrap only)
        if: steps.gate.outputs.bootstrap == 'true'
        working-directory: pr
        run: |
          rustup toolchain install --no-self-update
          cargo xtask ci properties-removal \
            --base "$GITHUB_WORKSPACE" \
            --head "$GITHUB_WORKSPACE/pr" \
            --event "$GITHUB_EVENT_PATH"
