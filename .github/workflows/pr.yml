# SPDX-License-Identifier: MIT OR Apache-2.0

# The PR pipeline's hosted jobs (RFC-0062 §2.1 and §2.3). `changes` lists the jobs to run, each
# hosted job runs only when listed, and `ci-gate` is the one required check that stands for them
# all (§2.5). Every job runs a `cargo xtask` command, so it runs the same way locally (§1).
#
# The other two required checks, `dco` and `pr-title`, are in `pr-meta.yml`: they re-run on label
# and edit events, which must not start a run of this workflow.
#
# Rules for this file (RFC-0062 §3.2 and §12.4):
# - permissions stay read-only, and no job holds a secret;
# - every action is pinned by its full commit SHA;
# - every job runs on a standard hosted runner, never on a lab label: lab jobs run only in
#   `lab.yml`, through the lab dispatcher;
# - `ci-gate` waits for every other job, and a new job is added to its `needs`.

name: pr

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# One run per PR: a push cancels the PR's run in progress. Merge groups are never cancelled.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # The jobs this change runs and the hardware it requires (RFC-0062 §2.2). The base branch's
  # `xtask` decides with the base's `ci/jobs.toml`, built with no cache, as for `ci-gate`, so a PR
  # cannot make it list nothing and skip every job (note 2026-10-22). It reads the PR's files
  # through git, as data: none of the PR's code runs in this job.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      jobs: ${{ steps.jobs.outputs.jobs }}
      hw_required: ${{ steps.jobs.outputs.hw_required }}
    steps:
      # On a PR, the head is the merge commit GitHub tests, `github.sha`, and the base is its
      # first parent, as for `pr-meta.yml`'s `dep-diff` (issue #1702). In a merge group, the base is
      # the group's base commit.
      - name: Check out the merge commit, two commits deep
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Move to the base, the merge commit's first parent
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD^2)" = "$HEAD_SHA"
          git checkout --detach --quiet HEAD^1
      - name: Check out the merge group's base
        if: github.event_name == 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.base_sha }}
          persist-credentials: false
      - name: Fetch the merge group's head, as data
        if: github.event_name == 'merge_group'
        env:
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: git fetch --no-tags --quiet --depth=1 origin "$HEAD_SHA"
      # No cache: code the PR runs in any other job can write a cache entry under this PR's ref.
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: changes
          cache: "off"
      # A base without `ci/jobs.toml` predates QUAL-E1-T07 and has no `changes` job. Only then does
      # the job list every hosted job that has a suite, and no hardware, as before T07; any other
      # failure fails the job, and `ci-gate` with it.
      - name: cargo xtask ci changes, from the base branch
        id: jobs
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ ! -f ci/jobs.toml ]; then
            echo "::warning::the base predates ci/jobs.toml (QUAL-E1-T07): listing every hosted job"
            echo 'jobs=["lint","build","hosted-test","hosted-l3"]' >> "$GITHUB_OUTPUT"
            echo 'hw_required=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cargo xtask ci changes \
            --base "$(git rev-parse HEAD)" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'lint')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every branch with its history, so a lint step can find the merge base with
          # `origin/main`, which a shallow clone lacks.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: lint
          # A same-repository PR saves its caches, which only its own later runs can read. A
          # fork's run never saves (RFC-0062 §3.3 item 3).
          cache: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'read-write' || 'read-only' }}
      - uses: ./.github/actions/install-cargo-deny
      # The pinned actionlint, for `lint`'s actionlint step (RFC-0062 §12.4).
      - uses: ./.github/actions/install-actionlint
      - run: cargo xtask ci lint

  build:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'build')
    name: build-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: macos-26
          - os: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: build
          cache: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'read-write' || 'read-only' }}
      - run: cargo xtask ci build
      - name: cargo xtask ci build-test-release
        if: matrix.os == 'linux'
        run: cargo xtask ci build-test-release

  hosted-test:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'hosted-test')
    name: hosted-test-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: macos-26
          - os: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: hosted-test
          cache: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'read-write' || 'read-only' }}
      # The licence fixtures run cargo-deny on Linux, and in CI they must.
      - if: matrix.os == 'linux'
        uses: ./.github/actions/install-cargo-deny
      # The second OS account that `syntropy-ipc`'s peer test connects from (DIST-E1-T03,
      # RFC-0034 §6.4). In CI the test fails without it.
      - if: matrix.os == 'linux'
        name: Add a second OS account for the IPC peer test
        run: |
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin syntropy-peer
          echo "SYNTROPY_IPC_PEER_USER=syntropy-peer" >> "$GITHUB_ENV"
      - if: matrix.os == 'macos'
        name: Add a second OS account for the IPC peer test
        run: |
          id=599
          while dscl . -search /Users UniqueID "$id" | grep -q .; do id=$((id - 1)); done
          sudo dscl . -create /Users/syntropy-peer
          sudo dscl . -create /Users/syntropy-peer UserShell /usr/bin/false
          sudo dscl . -create /Users/syntropy-peer UniqueID "$id"
          sudo dscl . -create /Users/syntropy-peer PrimaryGroupID 20
          sudo dscl . -create /Users/syntropy-peer NFSHomeDirectory /var/empty
          id syntropy-peer
          echo "SYNTROPY_IPC_PEER_USER=syntropy-peer" >> "$GITHUB_ENV"
      # On Windows the test starts its copy with `CreateProcessWithLogonW`, so it needs the
      # account's password: a random one, made here, masked in the log and never printed.
      # Letters and digits only: the test step runs under Git Bash, which rewrites an
      # environment value that starts with `/` into a Windows path (`C:/Program Files/Git/…`)
      # for the native programs it starts. A base64 password began with `/` one run in 64, and
      # the test's logon then failed with error 1326.
      - if: matrix.os == 'windows'
        name: Add a second OS account for the IPC peer test
        # Windows PowerShell, whose LocalAccounts module loads natively.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # 32 characters from [A-Za-z0-9] by rejection sampling, unbiased; `aA1` keeps the
          # upper, lower and digit classes that the complexity policy asks for.
          $alphabet = [char[]]'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          $chars = New-Object System.Collections.Generic.List[char]
          $buffer = New-Object byte[] 64
          while ($chars.Count -lt 32) {
            $rng.GetBytes($buffer)
            foreach ($b in $buffer) {
              if ($b -lt 248 -and $chars.Count -lt 32) { $chars.Add($alphabet[$b % 62]) }
            }
          }
          $password = (-join $chars) + 'aA1'
          if ($password -cnotmatch '^[A-Za-z0-9]{35}$') { throw 'the generated password is not 35 letters and digits' }
          Write-Output "::add-mask::$password"
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name syntropy-peer -Password $secure -PasswordNeverExpires -AccountNeverExpires | Out-Null
          # BUILTIN\Users, which may log on locally.
          if (-not (Get-LocalGroupMember -SID S-1-5-32-545 -Member syntropy-peer -ErrorAction SilentlyContinue)) {
            Add-LocalGroupMember -SID S-1-5-32-545 -Member syntropy-peer
          }
          Get-LocalUser -Name syntropy-peer | Format-List Name, Enabled, SID, PasswordExpires, PasswordRequired
          # The account logs on with this password now, as the test's will, or this step fails
          # with the Win32 error: a policy, an account flag or a missing logon right shows here,
          # not as a failed test later.
          Add-Type -Namespace SyntropyCi -Name Logon -MemberDefinition @'
          [DllImport("advapi32.dll", SetLastError = true, CharSet = CharSet.Unicode)]
          public static extern bool LogonUser(string user, string domain, string password, int type, int provider, out IntPtr token);
          [DllImport("kernel32.dll", SetLastError = true)]
          public static extern bool CloseHandle(IntPtr handle);
          '@
          $token = [IntPtr]::Zero
          # LOGON32_LOGON_INTERACTIVE, LOGON32_PROVIDER_DEFAULT.
          if (-not [SyntropyCi.Logon]::LogonUser('syntropy-peer', '.', $password, 2, 0, [ref]$token)) {
            $code = [Runtime.InteropServices.Marshal]::GetLastWin32Error()
            throw "syntropy-peer cannot log on with its new password: Win32 error $code"
          }
          [void][SyntropyCi.Logon]::CloseHandle($token)
          Write-Output 'syntropy-peer logs on with its password'
          Add-Content -Path $env:GITHUB_ENV -Value "SYNTROPY_IPC_PEER_USER=syntropy-peer"
          Add-Content -Path $env:GITHUB_ENV -Value "SYNTROPY_IPC_PEER_PASSWORD=$password"
      - run: cargo xtask test unit

  # L3: loom models, Miri and the sanitizer builds (RFC-0060 §3.4), when `changes` lists it. The
  # loom models run now, as `cargo xtask test loom` (QUAL-E3-T09); Miri and the sanitizer builds
  # join them with QUAL-E3-T10.
  hosted-l3:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'hosted-l3')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: hosted-l3
          cache: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'read-write' || 'read-only' }}
      - run: cargo xtask test loom

  # L5 nano parity smoke on the CPU provider (RFC-0060 §5). Planned: QUAL-E5-T06. `changes` does
  # not list it until it has a suite, so it shows as skipped, and `ci-gate` names the task.
  # Listed before then, it fails rather than passing on nothing.
  hosted-parity-nano:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'hosted-parity-nano')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: No nano parity suite yet
        run: |
          echo "::error::hosted-parity-nano has no suite yet (planned: QUAL-E5-T06)"
          exit 1

  # The required check. It always runs, even when the run is cancelled: a skipped job reports
  # success to branch protection, so a skipped gate would let a PR merge with nothing checked.
  #
  # The verdict comes from the base branch's `xtask`, built with no cache, as in `pr-meta.yml`,
  # so a PR cannot change how its own jobs are judged (RFC-0062 §2.2, note 2026-10-22).
  ci-gate:
    needs: [changes, lint, build, hosted-test, hosted-l3, hosted-parity-nano]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # The `hw/<job>` statuses on the PR's head commit (RFC-0062 §2.5).
      statuses: read
    steps:
      # On a PR, the head is the merge commit GitHub tests, `github.sha`, and the base is its
      # first parent, as for `pr-meta.yml`'s `dep-diff` (issue #1702). In a merge group, the base is
      # the group's base commit.
      - name: Check out the merge commit, two commits deep
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Move to the base, the merge commit's first parent
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD^2)" = "$HEAD_SHA"
          git checkout --detach --quiet HEAD^1
      - name: Check out the merge group's base
        if: github.event_name == 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.base_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-gate
          cache: "off"
      - name: Record the jobs' results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$NEEDS" | tee "$RUNNER_TEMP/needs.json"
      - name: Fetch the commit statuses of the PR's head
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh api --paginate "repos/$REPO/commits/$HEAD_SHA/statuses" > "$RUNNER_TEMP/statuses.json"
      # The base branch's evaluator decides, with the base's `ci/jobs.toml`. A base without that
      # file predates QUAL-E1-T07: its `ci-gate` takes `--needs` alone and has no hardware clause,
      # and only then is it called that way. A base with the file refuses that form, with exit
      # code 2, so the clause cannot be skipped.
      - name: cargo xtask ci ci-gate, from the base branch
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ ! -f ci/jobs.toml ]; then
            echo "::warning::the base predates ci/jobs.toml (QUAL-E1-T07): ci-gate runs without its hardware clause"
            cargo xtask ci ci-gate --needs "$RUNNER_TEMP/needs.json"
            exit
          fi
          statuses=()
          if [ "$EVENT_NAME" = pull_request ]; then
            statuses=(--statuses "$RUNNER_TEMP/statuses.json")
          fi
          status=0
          cargo xtask ci ci-gate \
            --needs "$RUNNER_TEMP/needs.json" \
            --event "$GITHUB_EVENT_PATH" \
            "${statuses[@]}" || status=$?
          if [ "$status" -eq 2 ]; then
            echo "::error::the base branch's ci-gate rejected its options; rebase onto main"
          fi
          exit "$status"
