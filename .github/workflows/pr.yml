# SPDX-License-Identifier: MIT OR Apache-2.0

# The PR pipeline's hosted jobs (RFC-0062 §2.1 and §2.3). `changes` lists the jobs to run, each
# hosted job runs only when listed, and `ci-gate` is the one required check that stands for them
# all (§2.5). Every job runs a `cargo xtask` command, so it runs the same way locally (§1).
#
# The other two required checks, `dco` and `pr-title`, are in `pr-meta.yml`: they re-run on label
# and edit events, which must not start a run of this workflow.
#
# Rules for this file (RFC-0062 §3.2 and §12.4):
# - permissions stay read-only, and no job holds a secret;
# - every action is pinned by its full commit SHA;
# - every job runs on a standard hosted runner, never on a lab label: lab jobs run only in
#   `lab.yml`, through the lab dispatcher;
# - `ci-gate` waits for every other job, and a new job is added to its `needs`.

name: pr

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# One run per PR: a push cancels the PR's run in progress. Merge groups are never cancelled.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.jobs.outputs.jobs }}
    steps:
      # Until QUAL-E1-T07's `cargo xtask ci changes --base <merge base>` computes the affected-job
      # set (§2.2), every run lists every hosted job that has a suite to run. `hosted-l3` and
      # `hosted-parity-nano` are listed once their suites exist (QUAL-E3-T09/T10, QUAL-E5-T06).
      # T07 also moves this step onto the base branch's `xtask`, as `ci-gate` is, so a PR cannot
      # list nothing and skip every job.
      - name: List the jobs to run
        id: jobs
        run: echo 'jobs=["lint","build","hosted-test"]' >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'lint')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every branch with its history, so a lint step can find the merge base with
          # `origin/main`, which a shallow clone lacks.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: lint
          # A same-repository PR saves its caches, which only its own later runs can read. A
          # fork's run never saves (RFC-0062 §3.3 item 3).
          cache: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'read-write' || 'read-only' }}
      - uses: ./.github/actions/install-cargo-deny
      - run: cargo xtask ci lint

  build:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'build')
    name: build-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: macos-26
          - os: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: build
          cache: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'read-write' || 'read-only' }}
      - run: cargo xtask ci build
      - name: cargo xtask ci build-test-release
        if: matrix.os == 'linux'
        run: cargo xtask ci build-test-release

  hosted-test:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'hosted-test')
    name: hosted-test-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: macos-26
          - os: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: hosted-test
          cache: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'read-write' || 'read-only' }}
      # The licence fixtures run cargo-deny on Linux, and in CI they must.
      - if: matrix.os == 'linux'
        uses: ./.github/actions/install-cargo-deny
      - run: cargo xtask test unit

  # L3: loom models, Miri and the sanitizer builds (RFC-0060 §3.4), when the closure includes
  # `ipc`, `tier`, `exec`, `io` or `net`. Planned: QUAL-E3-T09/T10. `changes` does not list it
  # until it has a suite, so it shows as skipped, and `ci-gate` names the tasks. Listed before
  # then, it fails rather than passing on nothing.
  hosted-l3:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'hosted-l3')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: No L3 suite yet
        run: |
          echo "::error::hosted-l3 has no suite yet (planned: QUAL-E3-T09/T10)"
          exit 1

  # L5 nano parity smoke on the CPU provider (RFC-0060 §5). Planned: QUAL-E5-T06. As for
  # `hosted-l3`, it shows as skipped, and fails if listed before its suite exists.
  hosted-parity-nano:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'hosted-parity-nano')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: No nano parity suite yet
        run: |
          echo "::error::hosted-parity-nano has no suite yet (planned: QUAL-E5-T06)"
          exit 1

  # The required check. It always runs, even when the run is cancelled: a skipped job reports
  # success to branch protection, so a skipped gate would let a PR merge with nothing checked.
  #
  # The verdict comes from the base branch's `xtask`, built with no cache, as in `pr-meta.yml`,
  # so a PR cannot change how its own jobs are judged (RFC-0062 §2.2, note 2026-10-22).
  ci-gate:
    needs: [changes, lint, build, hosted-test, hosted-l3, hosted-parity-nano]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the base branch, not the PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-gate
          cache: "off"
      - name: Record the jobs' results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$NEEDS" | tee "$RUNNER_TEMP/needs.json"
      # Bootstrap: while the base branch has no `ci-gate` job, which is true only until the PR
      # that adds it merges, that PR is judged by its own. A base whose `xtask` fails to build
      # fails here, and never falls back.
      - name: Find the base branch's ci-gate
        id: evaluator
        run: |
          jobs="$(cargo xtask ci --list)"
          if awk '$1 == "ci-gate" { found = 1 } END { exit !found }' <<<"$jobs"; then
            echo "source=base" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::the base branch has no ci-gate job yet, so this PR's own evaluator judges it"
            echo "source=pr" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out this PR, to bootstrap the evaluator
        if: steps.evaluator.outputs.source == 'pr'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          persist-credentials: false
      - name: cargo xtask ci ci-gate
        working-directory: ${{ steps.evaluator.outputs.source == 'pr' && 'pr' || '.' }}
        run: |
          rustup toolchain install --no-self-update
          cargo xtask ci ci-gate --needs "$RUNNER_TEMP/needs.json"
