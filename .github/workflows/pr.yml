# SPDX-License-Identifier: MIT OR Apache-2.0

# The PR pipeline's hosted jobs (RFC-0062 §2.1 and §2.3). `changes` lists the jobs to run, each
# hosted job runs only when listed, and `ci-gate` is the one required check that stands for them
# all (§2.5). Every job runs a `cargo xtask` command, so it runs the same way locally (§1).
#
# The other two required checks, `dco` and `pr-title`, are in `pr-meta.yml`: they re-run on label
# and edit events, which must not start a run of this workflow.
#
# Rules for this file (RFC-0062 §3.2 and §12.4):
# - permissions stay read-only, and no job holds a secret;
# - every action is pinned by its full commit SHA;
# - every job runs on a standard hosted runner, never on a lab label: lab jobs run only in
#   `lab.yml`, through the lab dispatcher;
# - `ci-gate` waits for every other job, and a new job is added to its `needs`.

name: pr

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# One run per PR: a push cancels the PR's run in progress. Merge groups are never cancelled.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.jobs.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Until QUAL-E1-T07's `cargo xtask ci changes --base <merge base>` computes the affected-job
      # set (§2.2), every run lists `lint`, `build` and `hosted-test`. `hosted-l3` is listed when
      # the change touches a crate, vendored code, the cargo config, `xtask`, the workspace's
      # `Cargo.toml` or `Cargo.lock`, the toolchain pin, this workflow or the composite actions it
      # uses. That over-triggers, which is safe, and skips plan-only changes; T07 replaces it with
      # §2.3's closure rule (the closure includes `ipc`, `tier`, `exec`, `io` or `net`).
      # `hosted-parity-nano` is listed once its suite exists (QUAL-E5-T06). T07 also moves this
      # step onto the base branch's `xtask`, as `ci-gate` is, so a PR cannot list nothing and skip
      # every job.
      - name: List the jobs to run
        id: jobs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          jobs='"lint","build","hosted-test"'
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          l3='^(crates/|third_party/|\.cargo/|xtask/|Cargo\.(toml|lock)$|rust-toolchain\.toml$'
          l3+='|\.github/(workflows/pr\.yml$|actions/))'
          if grep -qE "$l3" <<< "$changed"; then
            jobs="$jobs,\"hosted-l3\""
          fi
          echo "jobs=[$jobs]" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'lint')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every branch with its history, so a lint step can find the merge base with
          # `origin/main`, which a shallow clone lacks.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: lint
          # A same-repository PR saves its caches, which only its own later runs can read. A
          # fork's run never saves (RFC-0062 §3.3 item 3).
          cache: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'read-write' || 'read-only' }}
      - uses: ./.github/actions/install-cargo-deny
      - run: cargo xtask ci lint

  build:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'build')
    name: build-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: macos-26
          - os: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: build
          cache: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'read-write' || 'read-only' }}
      - run: cargo xtask ci build
      - name: cargo xtask ci build-test-release
        if: matrix.os == 'linux'
        run: cargo xtask ci build-test-release

  hosted-test:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'hosted-test')
    name: hosted-test-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: macos-26
          - os: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: hosted-test
          cache: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'read-write' || 'read-only' }}
      # The licence fixtures run cargo-deny on Linux, and in CI they must.
      - if: matrix.os == 'linux'
        uses: ./.github/actions/install-cargo-deny
      - run: cargo xtask test unit

  # L3: loom models, Miri and the sanitizer builds (RFC-0060 §3.4), when `changes` lists it. The
  # loom models run now, as `cargo xtask test loom` (QUAL-E3-T09); Miri and the sanitizer builds
  # join them with QUAL-E3-T10.
  hosted-l3:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'hosted-l3')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: hosted-l3
          cache: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'read-write' || 'read-only' }}
      - run: cargo xtask test loom

  # L5 nano parity smoke on the CPU provider (RFC-0060 §5). Planned: QUAL-E5-T06. `changes` does
  # not list it until it has a suite, so it shows as skipped, and `ci-gate` names the task.
  # Listed before then, it fails rather than passing on nothing.
  hosted-parity-nano:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'hosted-parity-nano')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: No nano parity suite yet
        run: |
          echo "::error::hosted-parity-nano has no suite yet (planned: QUAL-E5-T06)"
          exit 1

  # The required check. It always runs, even when the run is cancelled: a skipped job reports
  # success to branch protection, so a skipped gate would let a PR merge with nothing checked.
  #
  # The verdict comes from the base branch's `xtask`, built with no cache, as in `pr-meta.yml`,
  # so a PR cannot change how its own jobs are judged (RFC-0062 §2.2, note 2026-10-22).
  ci-gate:
    needs: [changes, lint, build, hosted-test, hosted-l3, hosted-parity-nano]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the base branch, not the PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-gate
          cache: "off"
      - name: Record the jobs' results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$NEEDS" | tee "$RUNNER_TEMP/needs.json"
      # The base branch's evaluator decides. `cargo xtask` exits 2 on a usage error, which an
      # unknown job is; that exit code, not help text, says the base has no `ci-gate` job.
      # Bootstrap: only #1577, the PR that adds the job, may then be judged by its own evaluator,
      # once; every other base without the job fails the gate.
      - name: cargo xtask ci ci-gate, from the base branch
        id: gate
        env:
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          status=0
          cargo xtask ci ci-gate --needs "$RUNNER_TEMP/needs.json" || status=$?
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "$status" -eq 2 ] && [ "$NUMBER" = 1577 ]; then
            echo "::warning::the base branch has no ci-gate job yet; #1577, which adds it, is judged by its own"
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -eq 2 ]; then
            echo "::error::the base branch has no ci-gate job, or rejected its options; rebase onto main"
          fi
          exit 1
      - name: Check out #1577, to bootstrap the evaluator
        if: steps.gate.outputs.bootstrap == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          persist-credentials: false
      - name: cargo xtask ci ci-gate, from #1577 (bootstrap only)
        if: steps.gate.outputs.bootstrap == 'true'
        working-directory: pr
        run: |
          rustup toolchain install --no-self-update
          cargo xtask ci ci-gate --needs "$RUNNER_TEMP/needs.json"
