<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="ring-title ring-desc">
  <title id="ring-title">Machines in a ring</title>
  <desc id="ring-desc">Three machines each run one pipeline stage, a contiguous range of layers. The head stage on a desktop PC passes its hidden state to the middle stage on a mini PC, which passes it to the tail stage on a Mac. The tail samples the token, returns it to the head for the next step, and streams it to a laptop that received the API request and runs no stage. Only activations and tokens cross the network during decode; membership and plans travel on a separate control plane.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 17px; font-weight: 600; }
    .body { font-size: 13.5px; }
    .label { font-size: 13px; }
    .stage { fill: #e8f0fe; stroke: #4a72c4; stroke-width: 1.5; }
    .ingress { fill: #f1eefb; stroke: #6b5bb5; stroke-width: 1.5; }
    .note { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1; }
    .pill { fill: #ffffff; stroke: #8c959f; stroke-width: 1; }
    .arrow { fill: none; stroke: #6e7781; stroke-width: 2; }
    .ring { fill: none; stroke: #4a72c4; stroke-width: 2.5; }
    .head { fill: #6e7781; }
    .ringhead { fill: #4a72c4; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .stage { fill: #13233f; stroke: #6d93e0; }
      .ingress { fill: #211b38; stroke: #9a8ae0; }
      .note { fill: #161b22; stroke: #6e7681; }
      .pill { fill: #0d1117; stroke: #6e7681; }
      .arrow { stroke: #8b949e; }
      .ring { stroke: #6d93e0; }
      .head { fill: #8b949e; }
      .ringhead { fill: #6d93e0; }
    }
  </style>
  <defs>
    <marker id="ring-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="ring-arrow-ring" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="ringhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- stages -->
  <rect class="stage" x="40" y="40" width="250" height="100" rx="10"/>
  <text class="title" x="58" y="68">Desktop with a GPU</text>
  <text class="body" x="58" y="93">head stage: first layers</text>
  <text class="body" x="58" y="113">embeds each step's input</text>

  <rect class="stage" x="470" y="40" width="250" height="100" rx="10"/>
  <text class="title" x="488" y="68">Mini PC</text>
  <text class="body" x="488" y="93">middle stage: next layers</text>

  <rect class="stage" x="470" y="290" width="250" height="100" rx="10"/>
  <text class="title" x="488" y="318">Mac</text>
  <text class="body" x="488" y="343">tail stage: last layers</text>
  <text class="body" x="488" y="363">samples each token</text>

  <rect class="ingress" x="40" y="290" width="250" height="100" rx="10"/>
  <text class="title" x="58" y="318">Laptop, the ingress</text>
  <text class="body" x="58" y="343">receives the API request</text>
  <text class="body" x="58" y="363">runs no stage</text>

  <!-- the ring -->
  <line class="ring" x1="290" y1="90" x2="467" y2="90" marker-end="url(#ring-arrow-ring)"/>
  <rect class="pill" x="325" y="78" width="110" height="24" rx="12"/>
  <text class="label" x="380" y="94.5" text-anchor="middle">hidden state</text>

  <line class="ring" x1="595" y1="140" x2="595" y2="287" marker-end="url(#ring-arrow-ring)"/>
  <rect class="pill" x="540" y="203" width="110" height="24" rx="12"/>
  <text class="label" x="595" y="219.5" text-anchor="middle">hidden state</text>

  <line class="ring" x1="490" y1="290" x2="273" y2="142" marker-end="url(#ring-arrow-ring)"/>
  <rect class="pill" x="317" y="203" width="126" height="24" rx="12"/>
  <text class="label" x="380" y="219.5" text-anchor="middle">sampled token</text>

  <!-- request and token stream -->
  <line class="arrow" x1="140" y1="290" x2="140" y2="143" marker-end="url(#ring-arrow)" stroke-dasharray="6 4"/>
  <rect class="pill" x="98" y="203" width="84" height="24" rx="12"/>
  <text class="label" x="140" y="219.5" text-anchor="middle">request</text>

  <line class="arrow" x1="470" y1="350" x2="293" y2="350" marker-end="url(#ring-arrow)" stroke-dasharray="6 4"/>
  <rect class="pill" x="316" y="338" width="128" height="24" rx="12"/>
  <text class="label" x="380" y="354.5" text-anchor="middle">token stream</text>

  <!-- note -->
  <rect class="note" x="40" y="420" width="680" height="58" rx="10"/>
  <text class="body" x="58" y="444">During decode only activations and tokens cross the network. Weights never do.</text>
  <text class="body" x="58" y="465">Membership and plans travel on a separate control plane, and the coordinator never sees a token.</text>
</svg>
