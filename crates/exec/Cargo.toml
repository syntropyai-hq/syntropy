[package]
name = "syntropy-exec"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
syntropy-core = { path = "../core" }
# `HostWaker`, which a `WakeSource` carries, and the `Error` a fault or a pool failure carries
# (RFC-0040 §4.2, §13).
syntropy-kernels = { path = "../kernels" }
# Hot-thread placement (`os::cpu_topology`, `pin_current_thread`) and the I/O engine's client.
syntropy-io = { path = "../io" }
# The rings between dispatchers, the `net` domain and the I/O threads (ADR-0012 item 4).
syntropy-spsc = { path = "../spsc" }

[dev-dependencies]
serde_json.workspace = true
# The simulator driver (`SimWorld`, `SimTicks`) that runs a stage through `poll_once` and
# `run_inline` (RFC-0060 §2.3, §8.2).
syntropy-testkit = { path = "../testkit" }

[features]
# Test-only (RFC-0001 §4.2 rule 10): compiles the intra-layer diagnostic tap points into step
# programs, for bisection (RFC-0060 §1.3, §5.6). Release artefacts never enable it; `cargo xtask
# check-deps` rule 10 checks that.
debug-taps = []
