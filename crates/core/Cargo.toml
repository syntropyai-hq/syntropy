[package]
name = "syntropy-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bitflags.workspace = true
serde.workspace = true
smallvec.workspace = true

[dev-dependencies]
# `NodeInfo` decodes across versions in the cluster's deterministic CBOR (ADR-0305; DIST-E2-T10).
ciborium.workspace = true
# The plan and policy types round-trip through the IPC's encoding (RFC-0001 §3.5, §18.20).
postcard.workspace = true
proptest.workspace = true
# Exact float round trips for the serde property tests.
serde_json = { workspace = true, features = ["float_roundtrip"] }
