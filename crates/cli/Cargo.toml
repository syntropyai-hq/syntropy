[package]
name = "syntropy-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "syntropy"
path = "src/main.rs"

[dependencies]
# The command tree (RFC-0051 §1: argument parsing with clap's derive).
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
# The native API's types, which the client reads and writes, and the local socket's name
# (RFC-0051 §1: "the client library is the same `syntropy-api` types the server uses").
syntropy-api = { path = "../api" }
# `ErrorClass`, which the exit-code table maps (RFC-0051 §2.2).
syntropy-core = { path = "../core" }
# The runtime location, `SYNTROPY_HOST` and `SYNTROPY_API_KEY` (RFC-0054 §1, §2.4).
syntropy-config = { path = "../config" }
# The local socket's client end, and the runner's `--ipc` endpoint (RFC-0051 §1; ADR-0015).
syntropy-ipc = { path = "../ipc", features = ["async"] }
# The client's HTTP/1.1 exchange on a single-threaded tokio runtime.
http-body-util.workspace = true
hyper = { workspace = true, features = ["client"] }
hyper-util.workspace = true
tokio = { workspace = true, features = ["net", "rt", "time"] }

[dev-dependencies]
# The contract tests serve the API in-process, as a daemon would.
tokio = { workspace = true, features = ["net", "rt-multi-thread", "time", "sync"] }
