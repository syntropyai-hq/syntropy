[package]
name = "syntropy-net"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3.workspace = true
ciborium.workspace = true
# Header and payload CRCs of every frame (RFC-0031 §6.1, ADR-0307 item 2).
crc32c.workspace = true
ed25519-dalek.workspace = true
# The endpoint of DIST-E7-T23; `net` is the only crate that links iroh (RFC-0001 §4.2 rule 6).
iroh.workspace = true
# The congestion controllers `quic.lan_initial_window` wraps (DIST-E7-T03; RFC-0031 §4.3).
noq-proto.workspace = true
# The TCP fallback's TLS 1.3 with raw Ed25519 keys (RFC-0031 §5.3), and its socket options.
rustls.workspace = true
serde.workspace = true
socket2.workspace = true
subtle.workspace = true
syntropy-config = { path = "../config" }
syntropy-core = { path = "../core" }
# The `syntropy-spsc` rings between the `net` task and the dispatchers (RFC-0031 §4.4, ADR-0012
# item 4).
syntropy-spsc = { path = "../spsc" }
# The `net` domain's runtime: the QUIC data plane's single-threaded runtime (RFC-0031 §4.4) and
# the TCP fallback's listener and channel drivers. `net` lets a channel's task await a ring's wake
# handle, and `macros` gives the QUIC channel drivers `select!`.
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls.workspace = true
zstd.workspace = true

[features]
# Test-only (RFC-0001 §4.2 rule 10): `endpoint::test_relay` runs iroh's test relay server on this
# host, for tests of crates above `net`, which rule 6 keeps from naming iroh. No release turns it on.
test-relay = ["iroh/test-utils"]

[dev-dependencies]
# `hazmat` signs with a chosen public key in the challenge, and `digest` exports its SHA-512, to
# build the mixed-order key vector.
ed25519-dalek = { workspace = true, features = ["digest", "hazmat"] }
# `test-utils` runs a relay server on this host for the forced-relay test, through iroh-relay's
# server.
iroh = { workspace = true, features = ["test-utils"] }
proptest.workspace = true
# Reads the official BLAKE3 test vectors (`third_party/blake3/test_vectors.json`).
serde_json.workspace = true
# The simulator's `SimTransport`, which the channel-conformance suite runs over (QUAL-E8-T04).
syntropy-testkit = { path = "../testkit", features = ["transport"] }
tokio.workspace = true
