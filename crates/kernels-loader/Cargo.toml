[package]
name = "syntropy-kernels-loader"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
syntropy-core = { path = "../core" }
syntropy-kernels = { path = "../kernels" }

[dev-dependencies]
# The test provider library builds op keys and build records with `smallvec!`.
smallvec.workspace = true

# The test provider library: a `cdylib` built with `kernels::abi::export!`, which the loader's
# boundary tests open (COMP-E9-T04). `build.rs` links it with the single-export version script
# or `.def` file.
[[example]]
name = "test_provider"
path = "examples/test_provider.rs"
crate-type = ["cdylib"]
