[package]
name = "syntropy-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# `RunnerState` and the transition table (RFC-0001 §3.3, §5.11).
syntropy-core = { path = "../core" }
# `RunnerMsg::StateChanged`, the message each transition sends (RFC-0001 §3.5).
syntropy-ipc = { path = "../ipc" }
# The process's log records: a command this build does not handle yet (RFC-0053 §4).
tracing.workspace = true

[dev-dependencies]
proptest = { workspace = true }
smallvec = { workspace = true }
