[package]
name = "syntropy-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# `RunnerState` and the transition table (RFC-0001 §3.3, §5.11).
syntropy-core = { path = "../core" }
# `RunnerMsg::StateChanged`, the message each transition sends (RFC-0001 §3.5).
syntropy-ipc = { path = "../ipc" }
# The process's log records: a command this build does not handle yet (RFC-0053 §4).
tracing.workspace = true

[dev-dependencies]
proptest = { workspace = true }
smallvec = { workspace = true }
# The tier manager's arena build on a real CUDA device (`tests/tier_arenas_cuda.rs`, TIER-E1-T07).
# `tier` and `kernels-cuda` are both layer 2, so neither can test against the other; the runner
# drives `Loading`, and no crate of the `hosted-l3` job depends on it.
syntropy-kernels = { path = "../kernels" }
syntropy-kernels-cuda = { path = "../kernels-cuda" }
syntropy-tier = { path = "../tier" }
