[package]
name = "syntropy-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The Hub's HTTPS client, blocking to match `RangeSource::read_at`; `store` is the one crate that
# links it (ADR-0432; RFC-0001 §4.2 rule 6). Default features off: no system proxy, no
# OpenSSL, and no crypto provider of its own.
reqwest.workspace = true
# The TLS config the Hub client uses, on `ring`'s provider (ADR-0018 §3).
rustls.workspace = true
# The OS's certificate roots for Hub reads.
rustls-platform-verifier.workspace = true
# The local index's record of each file (RFC-0041 §4.3), one JSON object per model, and the
# probe's `storage-mode.json` (§4.2).
serde.workspace = true
serde_json.workspace = true
# `Clock`, `ModelId` and the units (RFC-0001 §5).
syntropy-core = { path = "../core" }
# A file's (device, inode) through `os::file_identity`, syncing a directory, and the sparse-file
# calls of `os::sparse` (marking a file sparse, punching holes, allocated bytes; RFC-0041 §4.2).
syntropy-io = { path = "../io" }
# `FileDigest`, `ModelId`'s formula and `SourceRole` (RFC-0041 §1).
syntropy-manifest = { path = "../manifest" }

[dev-dependencies]
# The chunk tables' IDs, recomputed apart from the indexer (COMP-E11-T14).
blake3.workspace = true
# The "holes are never read" property test over random partial inventories (COMP-E11-T02).
proptest.workspace = true
