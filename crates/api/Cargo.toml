[package]
name = "syntropy-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
# `ErrorClass`, which the native error body carries (RFC-0001 §5.12).
syntropy-core = { path = "../core" }
syntropy-config = { path = "../config" }
# The request's trace at ingress: `traceparent` in and out (RFC-0053 §3.2).
syntropy-obs = { path = "../obs" }
syntropy-net = { path = "../net" }
# The local socket's listener and peer check (RFC-0050 §1.1), and the IPC protocol major that
# `/v1/syntropy/version` reports.
syntropy-ipc = { path = "../ipc", features = ["async"] }
# The HTTP server (RFC-0050 §1.1, PROD-E2-T01): hyper's HTTP/1.1 and HTTP/2 connections, its tokio
# glue and `auto` builder, and the response bodies. tokio's `net` gives the TCP listeners.
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tokio = { workspace = true, features = ["net"] }
# The rings' ends, which the pipeline holds.
syntropy-spsc = { path = "../spsc" }
# The local CA (PROD-E5-T03): certificates, the leaf resolver, validity times and the stored CA.
rcgen.workspace = true
rustls.workspace = true
serde_json.workspace = true
time.workspace = true
x509-parser.workspace = true
zeroize.workspace = true

[dev-dependencies]
# The fake runner the pipeline's tests run against (QUAL-E3-T18), and its `SimClock`.
syntropy-testkit = { path = "../testkit" }
# Parses `api.tls` values in the unit tests.
toml.workspace = true
# The server tests' HTTP/1.1 and HTTP/2 clients.
hyper = { workspace = true, features = ["client"] }
