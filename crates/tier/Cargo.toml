[package]
name = "syntropy-tier"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bitflags.workspace = true
serde.workspace = true
# The `syntropy tune` record in the state directory (`tune`, RFC-0020 §9.1 step 3).
serde_json.workspace = true
smallvec.workspace = true
syntropy-core = { path = "../core" }
syntropy-io = { path = "../io" }
syntropy-kernels = { path = "../kernels" }
syntropy-spsc = { path = "../spsc" }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
# `CountingAlloc`, for the test that the statistics ring allocates nothing in steady state.
syntropy-testkit = { path = "../testkit" }

# `syntropy_planted` compiles the planted out-of-bounds read in `arena`'s tests, which only the
# planted steps of `cargo xtask test miri` and `cargo xtask test asan` turn on (QUAL-E3-T10).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(syntropy_planted)"] }
