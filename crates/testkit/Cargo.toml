[package]
name = "syntropy-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The simulator's trace hash (RFC-0060 §8.2).
blake3.workspace = true
chacha20.workspace = true
# Scenario and preset files (RFC-0060 §8.5).
serde.workspace = true
# The fake runner's token lists, as `core`'s `TokenEntry` holds them.
smallvec.workspace = true
syntropy-config = { path = "../config" }
syntropy-core = { path = "../core" }
syntropy-graph = { path = "../graph" }
# The fixture generator (QUAL-E7-T01) reads its files back through the GGUF and safetensors
# readers and builds their census, and takes `RopeKind` from the family's spec.
syntropy-kernels = { path = "../kernels" }
syntropy-manifest = { path = "../manifest" }
# The fake runner (QUAL-E3-T18) serves a real region's `local_sequences` and `local_tokens` rings,
# in `ipc`'s record encoding, and holds their `spsc` ends. Not optional: its tests must run in the
# workspace's test job, and `ipc` brings no external crate `testkit` lacks but `postcard` and the
# OS bindings.
syntropy-ipc = { path = "../ipc" }
# `SimTransport` (QUAL-E8-T04) implements `net`'s `Transport` and `Channel`. Optional, so the crates
# that use `testkit` for anything else do not build `net` and iroh; `net`'s tests turn it on.
syntropy-net = { path = "../net", optional = true }
# The ring ends the fake runner holds.
syntropy-spsc = { path = "../spsc" }
toml.workspace = true

[features]
transport = ["dep:syntropy-net"]

[dev-dependencies]
# The engine conformance suite (TIER-E5-T04) runs `io`'s conformance harness over the nano fixture
# files this crate generates, against every engine the host has. It is this crate's test because
# `testkit` may depend on any workspace crate (RFC-0001 §4.2 rule 9) and `io` may not depend on
# `graph`, whose family specs the generator reads.
syntropy-io = { path = "../io" }
