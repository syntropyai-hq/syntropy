[package]
name = "syntropy-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "syntropy-bench"
path = "src/main.rs"

[dependencies]
# The rig fingerprint (RFC-0061 §2.1) and the inventory it hashes (§6.3).
blake3.workspace = true
serde.workspace = true
# `float_roundtrip` parses every float to the nearest value, so a stored measurement reads back
# bit for bit (RFC-0061 §2.2: results are JSON, and gates recompute from them).
serde_json = { workspace = true, features = ["float_roundtrip"] }
toml.workspace = true

[dev-dependencies]
proptest.workspace = true
