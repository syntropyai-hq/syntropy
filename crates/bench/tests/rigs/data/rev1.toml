#
# Fixture data for crates/bench/tests/rigs: the first of two revisions of a made-up inventory.
# rev2.toml changes R-FIXTURE-A, removes R-FIXTURE-B, adds R-FIXTURE-C and only reorders and
# reformats R-FIXTURE-D.

version = 1

[[rig]]
id = "R-FIXTURE-A"
os_image = "lab-linux-fixture-1"
kernel = "6.8.0-fixture"
power_plan = "performance"
room_sensor = "fixture-room-1"

[rig.cpu]
model = "Fixture Desktop CPU 24-core"
microcode = "0x114"

[[rig.memory]]
slot = "DIMM_A2"
size_gib = 64
speed_mts = 6000
part = "FIXTURE-64G-6000-A"

[[rig.memory]]
slot = "DIMM_B2"
size_gib = 64
speed_mts = 6000
part = "FIXTURE-64G-6000-B"

[[rig.gpu]]
slot = "PCIEX16_1"
model = "Fixture GPU 24 GB"
vbios = "95.02.18.80.5F"
driver = "580.65.06"
pcie = "gen4x16"

[[rig]]
id = "R-FIXTURE-B"
os_image = "lab-linux-fixture-1"
kernel = "6.8.0-fixture"
power_plan = "performance"
room_sensor = "fixture-room-1"

[rig.cpu]
model = "Fixture Desktop CPU 16-core"
microcode = "0xb404023"

[[rig.memory]]
slot = "DIMM_A1"
size_gib = 32
speed_mts = 5600
part = "FIXTURE-32G-5600"

[[rig]]
id = "R-FIXTURE-D"
os_image = "lab-linux-fixture-1"
kernel = "6.8.0-fixture"
power_plan = "performance"
room_sensor = "fixture-room-1"

[rig.cpu]
model = "Fixture Small CPU 6-core"
microcode = "0xf8"

[[rig.memory]]
slot = "DIMM_A1"
size_gib = 16
speed_mts = 3200
part = "FIXTURE-16G-3200-A"

[[rig.memory]]
slot = "DIMM_B1"
size_gib = 16
speed_mts = 3200
part = "FIXTURE-16G-3200-B"
