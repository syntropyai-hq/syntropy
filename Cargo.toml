[workspace]
resolver = "3"
# Every crate of RFC-0001 §4.1, bottom-up by layer. §4.2 says what each layer may depend on.
members = [
    # Layer 0
    "crates/core",
    "crates/obs",
    "crates/config",
    # The `#[derive(ConfigSection)]` macro that `config` re-exports (RFC-0054 §10.3); no workspace
    # dependencies
    "crates/config-derive",
    # Layer 1
    "crates/manifest",
    "crates/kernels",
    "crates/io",
    "crates/net",
    "crates/ipc",
    # The lock-free SPSC ring `io`, `net` and `ipc` share inside layer 1 (RFC-0001 §4.2 rule 2); no
    # workspace dependencies
    "crates/spsc",
    # Layer 2
    "crates/graph",
    "crates/kernels-cuda",
    "crates/kernels-hip",
    "crates/kernels-metal",
    "crates/kernels-vulkan",
    "crates/kernels-cpu",
    "crates/kernels-ggml",
    "crates/kernels-loader",
    "crates/tier",
    "crates/solver",
    "crates/text",
    "crates/probe",
    "crates/store",
    # Layer 3
    "crates/exec",
    "crates/cluster",
    # Layer 4
    "crates/sched",
    "crates/api",
    # Layer 5
    "crates/runner",
    "crates/daemon",
    # Layer 6
    "crates/cli",
    # Dev only
    "crates/testkit",
    "crates/bench",
    # Task runner for CI jobs and test suites (RFC-0062 §1, RFC-0060 §1.2); outside the crate graph
    "xtask",
]

[workspace.package]
# Crate versions are frozen; the product version lives in version.txt (RFC-0062 §8.1, ADR-0621).
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# The config snapshot swap with lock-free readers (RFC-0054 §9.1).
arc-swap = "1.9.3"
bitflags = { version = "2", features = ["serde"] }
# The `RigFingerprint` of RFC-0061 §2.1 (QUAL-E15-T01), and RFC-0034 §3's hashes and derivations
# in `syntropy-net`. `pure` is the portable Rust code: no C or assembly to build, and the same
# digest on every target.
blake3 = { version = "1.8.7", default-features = false, features = ["pure"] }
# The build-time driver that assembles `syntropy-kernels-cpu`'s SME2 unit (`src/sme2/*.S`) with
# the platform assembler (ADR-0402 item 3; RFC-0040 §7.3). A build dependency only, of that crate
# alone; nothing it builds runs outside AArch64 macOS, Linux and Android.
cc = "1.9.0"
# `SimEntropy`'s seeded ChaCha20 stream in `testkit` (RFC-0060 §2.1 rule T2). `rng` alone: the
# block generator over `rand_core`, without the cipher traits.
chacha20 = { version = "0.10.2", default-features = false, features = ["rng"] }
# Deterministic CBOR for the control envelope (RFC-0031 §9.1, ADR-0305), `syntropy-net` only.
ciborium = "0.2.2"
# CRC32C (Castagnoli) for frame headers and payloads (RFC-0031 §6.1), with SSE4.2 or Armv8 CRC
# instructions picked at run time and a table fallback; also the beacon, invite and log codecs.
crc32c = "0.6.8"
# Ed25519 with strict verification (RFC-0034 §3), `syntropy-net` only. Major 3 is the one iroh's
# key types use, so the two share one implementation. Pinned exactly: which keys and signatures
# it accepts is part of the protocol, so a new version is a reviewed change.
ed25519-dalek = "=3.0.0"
# `Full`, the whole-body type the API's JSON responses use, and `BoxBody`, which lets later routes
# stream, `syntropy-api` only. MIT. The lock file already held this version, through iroh.
http-body-util = { version = "0.1.5", default-features = false }
# The HTTP API's server (RFC-0050 §1.1, PROD-E2-T01), `syntropy-api` only: HTTP/1.1 and HTTP/2
# connections over any byte stream, on the daemon's `ctl` runtime. MIT. The lock file already held
# this version, through iroh. Only the server side and the two protocols: no client, no FFI.
hyper = { version = "1.12.0", default-features = false, features = ["http1", "http2", "server"] }
# hyper's tokio glue (`TokioIo`, `TokioExecutor`) and its `auto` connection builder, which serves
# HTTP/1.1 and HTTP/2 with prior knowledge on one listener by reading the HTTP/2 preface (RFC-0050
# §1.1), `syntropy-api` only. MIT. The lock file already held this version, through iroh. No
# client, proxy or graceful-shutdown features.
hyper-util = { version = "0.1.21", default-features = false, features = ["server-auto", "tokio"] }
# iroh, ADR-0011's transport library, linked only by `syntropy-net` (RFC-0001 §4.2 rule 6). Pinned
# exactly because this is the version the daemon builds on: DIST-E7-T23's endpoint and the field
# probe now, DIST-E7-T03's QUIC backend later, so a bump is a reviewed change. rust-version 1.91,
# below the toolchain pin. Its default features stay on:
# - `tls-ring` makes ring the TLS crypto provider (Apache-2.0 AND ISC, on ADR-0018's allow-list);
#   the aws-lc-rs provider is not built;
# - `portmapper` keeps UPnP and NAT-PMP port mapping, which raises the share of direct paths
#   behind home routers that the field probe measures; it brings `attohttpc` under MPL-2.0, a
#   per-crate exception in `deny.toml`.
iroh = "=1.4.1"
# The QUIC stack under iroh, named by `syntropy-net` alone for its congestion controllers: iroh
# re-exports the `Controller` traits but not `CubicConfig` or `Bbr3Config`, whose initial window
# `quic.lan_initial_window` sets (RFC-0031 §4.3, note of 2026-10-23; DIST-E7-T03). Pinned to the
# version iroh 1.4.1 pins, so `net` and iroh share one build of it, and with iroh's own features:
# none by default. MIT OR Apache-2.0.
noq-proto = { version = "=1.4.0", default-features = false }
# The constraint engine behind `syntropy-text`'s `ConstraintEngine` (RFC-0050 §7.2, ADR-0504;
# PROD-E3-T04), with `lark` only. Its defaults are off because they pull `borrow-or-share`, which
# is MIT-0 and outside ADR-0018's allow list, and a `rayon` thread pool and `getrandom`;
# `deny.toml` bans every feature but `lark`. Without `referencing`, a schema's `$ref` resolves
# only as a document-local `#/...` pointer.
llguidance = { version = "1.9.1", default-features = false, features = ["lark"] }
# The daemon-runner command channel's encoding (RFC-0001 §3.5): `syntropy-ipc`, and the
# dev-dependency of `syntropy-core` whose tests show the plan types postcard-encode. MIT OR
# Apache-2.0. The lock file already held this version, through iroh. Postcard's 1.x wire format is
# a published specification that stays fixed within the major version, which the cross-build
# adoption of RFC-0052 §6.5 relies on. No default features: `heapless-cas` serves targets without
# an allocator; `use-std` gives `Vec` output.
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
proc-macro2 = { version = "1.0.107", default-features = false, features = ["proc-macro"] }
# The node's local TLS CA and its leaves (RFC-0050 §11.1.1, PROD-E5-T03), `syntropy-api` only. On
# ring, the one TLS crypto provider (RFC-0034 §3), with no aws-lc build: `ring` implies its
# `crypto` feature. `x509-parser` reads the stored CA back to sign with it, and `zeroize` clears
# its key pairs. No `pem`: the CA encodes its one PEM block itself, from the bytes its binding
# covers. Pinned exactly: what the CA writes into a certificate, its name constraints above all,
# is part of the trust model, so a new version is a reviewed change.
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "x509-parser", "zeroize"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
quote = { version = "1.0.47", default-features = false, features = ["proc-macro"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
# TLS 1.3 with the ring provider only (RFC-0034 §3), the build iroh links: `syntropy-api` serves
# the local CA's leaves through its certificate resolver (PROD-E5-T03). No `aws_lc_rs` and no
# TLS 1.2 here; the API's listener (PROD-E5-T06) decides the versions it offers.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
# `preserve_order`: a JSON object keeps its document order. `llguidance` (the constraint engine in
# `text`) turns it on, and cargo unifies features, so it is set here for every build: one `Map`
# type everywhere, whatever else is in the build. Code whose output must not depend on document
# order sorts at the boundary (RFC-0060 §2.4 rule T4).
serde_json = { version = "1.0.145", features = ["preserve_order"] }
smallvec = { version = "1", features = ["serde"] }
# The explicit-state model check of election, lease, replication and heal (RFC-0032 Testing,
# DIST-E10-T08). A dev-dependency of `cluster` only.
stateright = "0.31.0"
# The TCP fallback's socket options that std and tokio leave out (RFC-0031 §5.3, DIST-E7-T05),
# `syntropy-net` only: `SO_SNDBUF` and `SO_RCVBUF` on an accepted socket, and `TCP_QUICKACK`,
# which needs `all`. The lock file already held this version, through tokio and iroh.
socket2 = { version = "0.6.5", features = ["all"] }
# Constant-time comparison of secrets (RFC-0034 §3), `syntropy-net` only.
subtle = "2.6.1"
syn = { version = "3.0.9", default-features = false, features = ["derive", "parsing", "printing", "proc-macro"] }
# Certificate validity times, the type rcgen takes (PROD-E5-T03).
time = { version = "0.3.55", default-features = false, features = ["std"] }
# The tokenizer engine of `syntropy-text` (RFC-0043 §8.2, ADR-0431 decision 1; COMP-E17-T02),
# Apache-2.0. Default features off: `onig` links the Oniguruma C regex library, `esaxx_fast` builds
# C++ through `cc`, and `progressbar` serves training only. `fancy-regex` is its pure-Rust regex
# backend, so the engine builds for every ADR-0020 target without a C toolchain. Pinned exactly:
# a new version can change tokens, so a bump is a reviewed change that reruns the tokenizer
# conformance suite (COMP-E17-T06).
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }
# The `net` domain's runtime (RFC-0031 §4.4): `syntropy-net` runs its QUIC data plane on a
# single-threaded tokio runtime of its own (DIST-E7-T03, ADR-0012), and its TCP fallback runs its
# listener and each channel's driver on it (DIST-E7-T05); its endpoint tests drive iroh, whose API
# is async on tokio. No compute crate depends on it (RFC-0001 §4.2 rule 3, which `check-deps`
# enforces).
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt-multi-thread", "time"] }
# The TCP fallback's async TLS (RFC-0031 §5.3, DIST-E7-T05), `syntropy-net` only: rustls on ring,
# as above, with no `aws_lc_rs` and no TLS 1.2. The lock file already held this version, through
# iroh.
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
# TOML reading only (no writer): the RFC-0042 tolerance tables, `numerics/tolerances-v<N>.toml`,
# the rig inventory `bench/lab/rigs.toml` (RFC-0061 §6.3) and fault plans (RFC-0060 §9.2).
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }
trybuild = "1.0.122"
# Reads a stored CA certificate's public key and extensions, and checks its self-signature with
# ring (`verify`) (PROD-E5-T03). rcgen links the same version for its `x509-parser` feature.
x509-parser = { version = "0.18.1", default-features = false, features = ["verify"] }
# YAML 1.2 reading for `cargo xtask workflows`, the workflow security lint of RFC-0062 §12.4
# (QUAL-E1-T09), xtask only. No `encoding` feature: the workflows are UTF-8.
yaml-rust2 = { version = "0.13.0", default-features = false }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }
# zstd level 3 for control messages over 64 KiB (RFC-0031 §9.1), `syntropy-net` only. It builds
# the bundled C library (BSD-3-Clause), so the build needs a C compiler.
zstd = { version = "0.14.3", default-features = false }

# Build profiles (RFC-0062 §4.4, RFC-0060 §1.3). `cargo xtask build --profile <p>` builds each
# with its test features: `dev` (cargo's own) and `test-release` with `fault-injection`,
# `debug-taps` and `guards`, `chaos` with `fault-injection`, and `release` with none, which
# `cargo xtask check-deps` rule 10 checks. xtask/tests/build_profiles.rs keeps its fixtures'
# copy of these sections identical to this one. The `pr` profile is QUAL-E16-T21's.

# Everything shipped. The panic strategy is cargo's default, unwind, which RFC-0040 §10.4's
# `catch_unwind` at the provider boundary needs (RFC-0062 §4.4).
[profile.release]
lto = "fat"
codegen-units = 1

# Release optimisation with debug assertions on, for L4, L5 diagnosis and L7.
[profile.test-release]
inherits = "release"
debug-assertions = true

# Release optimisation with `fault-injection`, for L8 lab chaos. Its own profile, so its
# artefacts never land in `target/release`.
[profile.chaos]
inherits = "release"
